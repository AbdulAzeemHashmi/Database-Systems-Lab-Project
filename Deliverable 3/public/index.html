<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RideFlow | Welcome</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="master-container">
      <header class="brand-header">
        <h1 class="logo" style="font-size: 2.5rem; margin-bottom: 10px">
          RideFlow
        </h1>
        <p class="subtitle" id="portal-subtitle" style="margin-bottom: 30px; color: var(--accent-color); font-weight: 500;">
          Premium ride-hailing at your fingertips.
        </p>
      </header>

      <section class="card" style="text-align: center">
        <div style="display: flex; flex-direction: column; gap: 16px">
          <a href="#" id="btn-login" class="btn" style="text-decoration: none; display: flex; justify-content: center; align-items: center;">
            <span>Sign In</span>
          </a>

          <a href="#" id="btn-register" class="btn" style="background: transparent; border: 1px solid var(--border-strong); color: var(--text-primary); text-decoration: none; display: flex; justify-content: center; align-items: center;">
            <span>Create an Account</span>
          </a>
        </div>

        <footer class="card-footer" style="margin-top: 24px;">
          <p><a href="role.html" style="color: var(--text-secondary);">← Back to Role Selection</a></p>
        </footer>
      </section>
    </main>

    <script src="./js/authClient.js"></script>
  </body>
</html>
